<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JM Downloader Engine</title>
</head>
<body>
<script>
/* =========================================================
 * JM 漫画下载引擎核心（隐藏 WebView 中运行）
 * 流程: comic_read API → AES 解密 → 并发下载图片 → 图片乱序还原 → AndroidBridge.saveFile 保存
 * ========================================================= */
'use strict';

// ============================== 日志 ==============================
function log(msg) {
  try { console.log(msg); } catch (e) {}
  try {
    if (typeof AndroidBridge !== 'undefined' && AndroidBridge && AndroidBridge.log) {
      AndroidBridge.log(String(msg).replace(/['"\\]/g, ''));
    }
  } catch (e) {}
}

// ============================== UTF-8 ==============================
function u8(str) {
  var out = [], i, c;
  for (i = 0; i < str.length; i++) {
    c = str.charCodeAt(i);
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
    else if (c < 0xD800 || c >= 0xE000) out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    else {
      i++;
      c = 0x10000 + (((c & 0x3FF) << 10) | (str.charCodeAt(i) & 0x3FF));
      out.push(0xF0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
  }
  return out;
}

function u8str(bytes) {
  var out = '', i = 0, c, c2, c3, c4;
  while (i < bytes.length) {
    c = bytes[i++];
    if (c < 0x80) out += String.fromCharCode(c);
    else if (c < 0xE0) { c2 = bytes[i++]; out += String.fromCharCode(((c & 31) << 6) | (c2 & 63)); }
    else if (c < 0xF0) {
      c2 = bytes[i++]; c3 = bytes[i++];
      out += String.fromCharCode(((c & 15) << 12) | ((c2 & 63) << 6) | (c3 & 63));
    } else {
      c2 = bytes[i++]; c3 = bytes[i++]; c4 = bytes[i++];
      var cp = (((c & 7) << 18) | ((c2 & 63) << 12) | ((c3 & 63) << 6) | (c4 & 63)) - 0x10000;
      out += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 0x3FF));
    }
  }
  return out;
}

// ============================== MD5（标准算法，K表内嵌） ==============================
var MD5_K = [
  0xd76aa478,0xe8c7b756,0x242070db,0xc1bdceee,0xf57c0faf,0x4787c62a,0xa8304613,0xfd469501,
  0x698098d8,0x8b44f7af,0xffff5bb1,0x895cd7be,0x6b901122,0xfd987193,0xa679438e,0x49b40821,
  0xf61e2562,0xc040b340,0x265e5a51,0xe9b6c7aa,0xd62f105d,0x02441453,0xd8a1e681,0xe7d3fbc8,
  0x21e1cde6,0xc33707d6,0xf4d50d87,0x455a14ed,0xa9e3e905,0xfcefa3f8,0x676f02d9,0x8d2a4c8a,
  0xfffa3942,0x8771f681,0x6d9d6122,0xfde5380c,0xa4beea44,0x4bdecfa9,0xf6bb4b60,0xbebfbc70,
  0x289b7ec6,0xeaa127fa,0xd4ef3085,0x04881d05,0xd9d4d039,0xe6db99e5,0x1fa27cf8,0xc4ac5665,
  0xf4292244,0x432aff97,0xab9423a7,0xfc93a039,0x655b59c3,0x8f0ccc92,0xffeff47d,0x85845dd1,
  0x6fa87e4f,0xfe2ce6e0,0xa3014314,0x4e0811a1,0xf7537e82,0xbd3af235,0x2ad7d2bb,0xeb86d391
];
var MD5_S = [
  7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
  5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
  4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
  6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21
];

function md5hex(str) {
  var bytes = u8(str);
  var len = bytes.length;
  var l = (((len + 9) + 63) >> 6) << 6;
  var msg = new Array(l);
  var i, j;
  for (i = 0; i < l; i++) msg[i] = 0;
  for (i = 0; i < len; i++) msg[i] = bytes[i];
  msg[len] = 0x80;
  var bits = len * 8;
  msg[l - 8] = bits & 0xFF; msg[l - 7] = (bits >> 8) & 0xFF;
  msg[l - 6] = (bits >> 16) & 0xFF; msg[l - 5] = (bits >> 24) & 0xFF;

  var a0 = 0x67452301, b0 = 0xEFCDAB89, c0 = 0x98BADCFE, d0 = 0x10325476;

  function rl(x, c) { return ((x << c) | (x >>> (32 - c))) >>> 0; }

  for (var off = 0; off < l; off += 64) {
    var M = [];
    for (j = 0; j < 16; j++) {
      M.push((msg[off + j * 4] | (msg[off + j * 4 + 1] << 8) | (msg[off + j * 4 + 2] << 16) | (msg[off + j * 4 + 3] << 24)) >>> 0);
    }
    var A = a0, B = b0, C = c0, D = d0, F, g;
    for (i = 0; i < 64; i++) {
      if (i < 16) { F = (B & C) | (~B & D); g = i; }
      else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
      else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7 * i) % 16; }
      F = ((F + A + MD5_K[i] + M[g]) >>> 0);
      A = D; D = C; C = B;
      B = ((B + rl(F, MD5_S[i])) >>> 0);
    }
    a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0;
  }
  function hx(x) {
    var s = (x >>> 0).toString(16);
    while (s.length < 8) s = '0' + s;
    return s.substring(6, 8) + s.substring(4, 6) + s.substring(2, 4) + s.substring(0, 2);
  }
  return hx(a0) + hx(b0) + hx(c0) + hx(d0);
}

// ============================== Base64 ==============================
var B64_CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

function b64FromU8(bytes) {
  var out = '', i, b0, b1, b2;
  for (i = 0; i < bytes.length; i += 3) {
    b0 = bytes[i];
    b1 = (i + 1 < bytes.length) ? bytes[i + 1] : 0;
    b2 = (i + 2 < bytes.length) ? bytes[i + 2] : 0;
    out += B64_CH.charAt(b0 >> 2) + B64_CH.charAt(((b0 & 3) << 4) | (b1 >> 4));
    out += (i + 1 < bytes.length) ? B64_CH.charAt(((b1 & 15) << 2) | (b2 >> 6)) : '=';
    out += (i + 2 < bytes.length) ? B64_CH.charAt(b2 & 63) : '=';
  }
  return out;
}

function u8FromB64(str) {
  var lut = {};
  var i;
  for (i = 0; i < 64; i++) lut[B64_CH.charAt(i)] = i;
  str = String(str).replace(/[^A-Za-z0-9+/]/g, '');
  var out = [];
  for (i = 0; i < str.length; i += 4) {
    var c0 = lut[str.charAt(i)], c1 = lut[str.charAt(i + 1)];
    var c2 = lut[str.charAt(i + 2)], c3 = lut[str.charAt(i + 3)];
    out.push((c0 << 2) | (c1 >> 4));
    if (c2 !== undefined) out.push(((c1 & 15) << 4) | (c2 >> 2));
    if (c3 !== undefined) out.push(((c2 & 3) << 6) | c3);
  }
  return out;
}

// ============================== AES-256-ECB 解密 ==============================
var AES = (function () {
  var sbox = new Array(256), invsbox = new Array(256);
  (function genSbox() {
    function rotl8(x, n) { return ((x << n) | (x >>> (8 - n))) & 0xFF; }
    var p = 1, q = 1;
    do {
      p = (p ^ (p << 1) ^ ((p & 0x80) ? 0x1B : 0)) & 0xFF;
      q ^= q << 1; q &= 0xFF;
      q ^= q << 2; q &= 0xFF;
      q ^= q << 4; q &= 0xFF;
      if (q & 0x80) q ^= 0x09;
      var x = (q ^ rotl8(q, 1) ^ rotl8(q, 2) ^ rotl8(q, 3) ^ rotl8(q, 4)) & 0xFF;
      sbox[p] = (x ^ 0x63) & 0xFF;
    } while (p !== 1);
    sbox[0] = 0x63;
    for (var i = 0; i < 256; i++) invsbox[sbox[i]] = i;
  })();

  function xtime(a) { return ((a << 1) ^ ((a & 0x80) ? 0x1B : 0)) & 0xFF; }
  function gmul(a, b) {
    var r = 0;
    while (b) {
      if (b & 1) r ^= a;
      a = xtime(a);
      b >>= 1;
    }
    return r & 0xFF;
  }

  function expandKey(key) {
    var Nk = 8, Nr = 14;
    var w = new Array(4 * (Nr + 1) * 4);
    var i, t0, t1, t2, t3;
    for (i = 0; i < Nk * 4; i++) w[i] = key[i];
    var rc = [0x01, 0x02, 0x04, 0x08, 0x10, 0x20, 0x40, 0x80];
    for (i = Nk; i < 4 * (Nr + 1); i++) {
      t0 = w[(i - 1) * 4]; t1 = w[(i - 1) * 4 + 1]; t2 = w[(i - 1) * 4 + 2]; t3 = w[(i - 1) * 4 + 3];
      if (i % Nk === 0) {
        var tmp = t0;
        t0 = sbox[t1]; t1 = sbox[t2]; t2 = sbox[t3]; t3 = sbox[tmp];
        t0 ^= rc[i / Nk - 1];
      } else if (i % Nk === 4) {
        t0 = sbox[t0]; t1 = sbox[t1]; t2 = sbox[t2]; t3 = sbox[t3];
      }
      w[i * 4] = w[(i - Nk) * 4] ^ t0;
      w[i * 4 + 1] = w[(i - Nk) * 4 + 1] ^ t1;
      w[i * 4 + 2] = w[(i - Nk) * 4 + 2] ^ t2;
      w[i * 4 + 3] = w[(i - Nk) * 4 + 3] ^ t3;
    }
    return w;
  }

  function addRoundKey(s, w, round) {
    var o = round * 16;
    for (var i = 0; i < 16; i++) s[i] ^= w[o + i];
  }

  function invSubBytes(s) {
    for (var i = 0; i < 16; i++) s[i] = invsbox[s[i]];
  }

  function invShiftRows(s) {
    var t = s.slice();
    var r, c;
    for (r = 0; r < 4; r++) {
      for (c = 0; c < 4; c++) {
        s[c * 4 + r] = t[(((c - r) & 3) * 4) + r];
      }
    }
  }

  function invMixColumns(s) {
    for (var c = 0; c < 4; c++) {
      var o = c * 4;
      var a0 = s[o], a1 = s[o + 1], a2 = s[o + 2], a3 = s[o + 3];
      s[o] = gmul(a0, 14) ^ gmul(a1, 11) ^ gmul(a2, 13) ^ gmul(a3, 9);
      s[o + 1] = gmul(a0, 9) ^ gmul(a1, 14) ^ gmul(a2, 11) ^ gmul(a3, 13);
      s[o + 2] = gmul(a0, 13) ^ gmul(a1, 9) ^ gmul(a2, 14) ^ gmul(a3, 11);
      s[o + 3] = gmul(a0, 11) ^ gmul(a1, 13) ^ gmul(a2, 9) ^ gmul(a3, 14);
    }
  }

  function decryptBlock(block16, w) {
    var s = block16.slice();
    addRoundKey(s, w, 14);
    for (var round = 13; round >= 1; round--) {
      invShiftRows(s);
      invSubBytes(s);
      addRoundKey(s, w, round);
      invMixColumns(s);
    }
    invShiftRows(s);
    invSubBytes(s);
    addRoundKey(s, w, 0);
    return s;
  }

  return { decryptBlock: decryptBlock, expandKey: expandKey };
})();

function aesDecryptB64(b64, keyStr) {
  var data = u8FromB64(b64);
  var key = u8(keyStr);
  var w = AES.expandKey(key);
  var out = [];
  for (var i = 0; i < data.length; i += 16) {
    var block = data.slice(i, i + 16);
    var dec = AES.decryptBlock(block, w);
    for (var j = 0; j < 16; j++) out.push(dec[j]);
  }
  var pad = out[out.length - 1];
  if (pad >= 1 && pad <= 16) out = out.slice(0, out.length - pad);
  return u8str(out);
}

// ============================== 乱序还原参数 ==============================
function computePieces(jmcode, seriesId, fname) {
  var power = 0;
  if (jmcode >= seriesId) {
    power = (jmcode <= 421925) ? 10 : 8;
  }
  if (power !== 0) {
    var h = md5hex(String(jmcode) + fname);
    var num = h.charCodeAt(31);
    var mod = num % power;
    return (mod + 1) * 2;
  }
  return 0;
}

// ============================== 网络 ==============================
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function fetchTimeout(url, opts, ms) {
  if (!/^https:\/\//i.test(url)) {
    return Promise.reject(new Error('非 HTTPS 资源，已阻止'));
  }
  return new Promise(function (resolve, reject) {
    var ctrl = new AbortController();
    var tid = setTimeout(function () {
      try { ctrl.abort(); } catch (e) {}
      reject(new Error('请求超时'));
    }, ms);
    fetch(url, Object.assign({ signal: ctrl.signal }, opts || {}))
      .then(function (r) { clearTimeout(tid); resolve(r); })
      .catch(function (e) { clearTimeout(tid); reject(e); });
  });
}

async function fetchJsonRetry(url, headers, tries) {
  var lastErr = null;
  for (var i = 0; i < tries; i++) {
    try {
      var r = await fetchTimeout(url, { headers: headers, mode: 'cors', credentials: 'omit' }, 20000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      lastErr = e;
      log('[下载] 接口请求重试 ' + (i + 1) + '/' + tries + ': ' + (e && e.message ? e.message : e));
      await sleep(700);
    }
  }
  throw lastErr || new Error('请求失败');
}

// ============================== 图片加载与重组 ==============================
function loadImage(url) {
  return new Promise(function (res, rej) {
    var img = new Image();
    img.onload = function () { res(img); };
    img.onerror = function () { rej(new Error('图片解码失败')); };
    img.src = url;
  });
}

async function descramble(buff, pieces) {
  var raw = new Uint8Array(buff);
  var blob = new Blob([buff]);
  var objUrl = URL.createObjectURL(blob);
  try {
    var img = await loadImage(objUrl);
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;
    if (pieces <= 1 || pieces > h) return { b64: b64FromU8(raw), ext: null };
    var ph = Math.floor(h / pieces);
    if (ph < 1) return { b64: b64FromU8(raw), ext: null };
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    for (var i = 0; i < pieces; i++) {
      var j = pieces - 1 - i;
      var sy = j * ph;
      var sh = (j === pieces - 1) ? (h - sy) : ph;
      ctx.drawImage(img, 0, sy, w, sh, 0, i * ph, w, sh);
    }
    var dataUrl = cv.toDataURL('image/webp', 0.95);
    var comma = dataUrl.indexOf(',');
    var head = dataUrl.substring(0, comma);
    var ext = null;
    if (head.indexOf('image/png') >= 0) ext = 'png';
    else if (head.indexOf('image/jpeg') >= 0) ext = 'jpg';
    return { b64: dataUrl.substring(comma + 1), ext: ext };
  } finally {
    try { URL.revokeObjectURL(objUrl); } catch (e) {}
  }
}

// ============================== 主流程 ==============================
var SECRET = '185Hcomic3PAPP7R';
var dlStarted = false;

async function __startDownload(code) {
  if (dlStarted) return;
  dlStarted = true;
  try {
    log('[下载] 引擎启动，目标 JM' + code);

    var version = '2.0.26';
    try {
      var vr = await fetchTimeout('https://www.cdnutc.me/static/jmapp3apk/version.json', { headers: { 'accept': '*/*' } }, 5000);
      var vj = await vr.json();
      if (vj && vj.version) version = vj.version;
    } catch (e) {
      log('[下载] 版本获取失败，使用默认 ' + version);
    }

    var ts = Math.floor(Date.now() / 1000);
    var token = md5hex(String(ts) + SECRET);
    var apiHeaders = {
      'accept': '*/*',
      'authorization': '',
      'x-requested-with': 'com.a7m3p9xv.t6qk2z8.app',
      'Tokenparam': ts + ',' + version,
      'Token': token,
      'accept-language': 'zh-CN,zh;q=0.9'
    };
    log('[下载] 请求漫画信息 id=' + code + ' ts=' + ts);
    var resp = await fetchJsonRetry('https://www.cdngwc.cc/comic_read?id=' + code, apiHeaders, 3);
    if (!resp || !resp.data) throw new Error('接口响应缺少 data 字段');

    var keyHex = md5hex(String(ts) + SECRET);
    var plain = aesDecryptB64(resp.data, keyHex);
    var info = JSON.parse(plain);
    var name = info.name || ('JM' + code);
    var images = info.images || [];
    var total = info.total_page || images.length;
    var seriesId = Number(info.series_id);
    log('[下载] 漫画《' + name + '》共 ' + total + ' 页，开始下载…');

    var dirName = 'JM' + code;
    var okCount = 0, errCount = 0;
    var idx = 0;

    async function worker() {
      while (true) {
        var i = idx++;
        if (i >= images.length) return;
        var url = images[i].image;
        var base = 'page_' + (i + 1) + '.webp';
        try {
          var pn = new URL(url).pathname;
          var seg = pn.split('/').pop();
          if (seg) base = seg;
        } catch (e) {}
        var fnameNoExt = base.replace(/\.\w+$/, '');
        var em = base.match(/\.(\w+)$/);
        var ext = em ? em[1] : 'webp';
        var success = false;
        for (var r = 0; r <= 3 && !success; r++) {
          try {
            var r0 = await fetchTimeout(url, { mode: 'cors', credentials: 'omit' }, 25000);
            if (!r0.ok) throw new Error('HTTP ' + r0.status);
            var buff = await r0.arrayBuffer();
            var pieces = computePieces(Number(code), seriesId, fnameNoExt);
            var outB64, outExt = ext;
            if (pieces > 1) {
              var res = await descramble(buff, pieces);
              outB64 = res.b64;
              if (res.ext) outExt = res.ext;
            } else {
              outB64 = b64FromU8(new Uint8Array(buff));
            }
            var outName = fnameNoExt + '.' + outExt;
            AndroidBridge.saveFile(dirName, outName, outB64);
            success = true;
            okCount++;
            log('[下载] ' + (i + 1) + '/' + images.length + ' ✓ ' + outName + (pieces > 1 ? (' [重组' + pieces + '片]') : ''));
          } catch (e) {
            log('[下载] ' + (i + 1) + ' 重试(' + (r + 1) + '): ' + (e && e.message ? e.message : e));
            await sleep(800);
          }
        }
        if (!success) {
          errCount++;
          log('[下载] ' + (i + 1) + '/' + images.length + ' ✗ 失败');
        }
      }
    }

    await Promise.all([worker(), worker(), worker()]);

    var summary = '下载完成：成功 ' + okCount + ' / 失败 ' + errCount;
    log('[下载] ' + summary + ' → Download/' + dirName + '/');
    try { if (AndroidBridge.finish) AndroidBridge.finish(summary, okCount, errCount); } catch (e) {}
  } catch (e) {
    var msg = '下载失败: ' + (e && e.message ? e.message : e);
    log('[下载] ' + msg);
    try { if (AndroidBridge.finish) AndroidBridge.finish(msg, 0, 0); } catch (e2) {}
  }
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { md5hex: md5hex, b64FromU8: b64FromU8, u8FromB64: u8FromB64, aesDecryptB64: aesDecryptB64, computePieces: computePieces };
}
</script>
